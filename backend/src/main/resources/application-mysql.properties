# ---------------------------------------------------------------------------
# Production profile - MySQL (Section 13, build plan Step 3).
#
#   mysql -u root -p -e "CREATE DATABASE smartroom CHARACTER SET utf8mb4;"
#   mysql -u root -p smartroom < src/main/resources/db/mysql-schema.sql
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
#
# ddl-auto is 'none': the schema is owned by mysql-schema.sql, which carries the
# indexes and the ENUM columns exactly as the build plan specifies. Hibernate
# neither generates nor rewrites tables. ('validate' is a reasonable upgrade once
# you have a MySQL instance to test against - Hibernate's validator is fussy about
# MySQL ENUM columns, so verify before committing to it.)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:smartroom}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=10000
