spring.application.name=smart-room-backend
server.port=8081

# ---------------------------------------------------------------------------
# Persistence
# ---------------------------------------------------------------------------
# The default profile is in-memory H2 so the whole system can run immediately
# without a local MySQL installation. Switch to MySQL with:
#     --spring.profiles.active=mysql
# ---------------------------------------------------------------------------
spring.profiles.active=h2
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Decision engine (Section 21). Every value is configurable; the defaults are
# the ones documented in the specification and MUST be recalibrated per room
# (build plan Step 7).
# ---------------------------------------------------------------------------
smartroom.engine.target-temperature=24.0
smartroom.engine.cold-threshold=21.0
smartroom.engine.ac-runtime-limit=PT60M
smartroom.engine.recommendation-min=22
smartroom.engine.recommendation-max=27
smartroom.engine.hysteresis-interval=PT10M

# ---------------------------------------------------------------------------
# AC status detection (Section 20.3, Option C - supply-vent probe).
# vent-delta-threshold is the assumed starting value only. Measure the real
# vent-to-room difference with the AC genuinely ON and OFF and set it from that
# data (build plan Step 7.3).
# ---------------------------------------------------------------------------
smartroom.ac.vent-delta-threshold=4.0
smartroom.ac.stale-reading-timeout=PT5M
smartroom.ac.manual-override-ttl=PT30M

# ---------------------------------------------------------------------------
# Ingest authentication (Section 20.6). Override in production.
# ---------------------------------------------------------------------------
smartroom.security.api-key=smart-room-dev-key
smartroom.security.api-key-header=X-API-Key

# ---------------------------------------------------------------------------
# Dashboard
# ---------------------------------------------------------------------------
smartroom.dashboard.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
smartroom.dashboard.default-room-id=ROOM101
# MJPEG stream. Currently the PC webcam served by tools/webcam_stream.py, which stands
# in for the board while the Live Feed panel is being verified. Restore the ESP32-CAM
# line - the address its CameraWebServer sketch prints on the serial monitor - once the
# board is flashed.
# smartroom.dashboard.camera-stream-url=http://192.168.1.50:81/stream
smartroom.dashboard.camera-stream-url=http://localhost:8091/stream

# ---------------------------------------------------------------------------
# Logging (build plan Step 8.3)
# ---------------------------------------------------------------------------
logging.level.com.smartroom.backend=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%logger{20}] %msg%n

# ---------------------------------------------------------------------------
# ThingsBoard
# ---------------------------------------------------------------------------
thingsboard.url=https://thingsboard.cloud
thingsboard.device-id=37f0e720-9718-11f1-bb5b-f59caa77e86d
thingsboard.api-key=${TB_API_KEY}
thingsboard.poll-interval-ms=10000
thingsboard.poll-initial-delay-ms=5000