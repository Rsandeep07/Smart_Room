# ---------------------------------------------------------------------------
# Development / demonstration profile.
#
# In-memory H2 so the backend, the dashboard and the ingest endpoints can be
# exercised end to end before MySQL is installed. Nothing survives a restart.
# The production target remains MySQL (Section 13) - see application-mysql.properties.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:smartroom;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
